<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Happy Birthday ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#1b2140;--bg2:#3a2350;--gold:#f7d9a8;--rose:#ff7a9a;--soft:#fff1f4}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;color:var(--soft);font-family:'Quicksand',sans-serif;background:radial-gradient(ellipse at 50% 25%,var(--bg2),var(--bg1) 80%)}
#fx,#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.p{position:absolute;bottom:-30px;animation:rise linear forwards;opacity:0}
@keyframes rise{10%{opacity:.8}100%{transform:translateY(-110vh) translateX(var(--dx));opacity:0}}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;opacity:0;pointer-events:none;transform:translateY(20px);transition:opacity .9s,transform .9s;touch-action:none}
.screen.active{opacity:1;pointer-events:auto;transform:none}
.script{font-family:'Caveat',cursive;font-weight:700}
h1{font-size:clamp(2.6rem,12vw,4.4rem);line-height:1.05;color:var(--gold);text-shadow:0 0 24px rgba(255,122,154,.55)}
h1 em{display:block;font-style:normal;color:var(--rose)}
.sub{margin-top:14px;font-size:1.1rem;opacity:.85}
.fade>*{opacity:0;transform:translateY(14px)}
.active.fade>*{animation:up .9s forwards}
.active.fade>*:nth-child(2){animation-delay:.7s}.active.fade>*:nth-child(3){animation-delay:1.4s}
@keyframes up{to{opacity:1;transform:none}}
.btn{margin-top:30px;padding:13px 32px;border:1px solid var(--gold);border-radius:999px;background:rgba(255,255,255,.08);color:var(--gold);font:600 1.05rem 'Quicksand',sans-serif;cursor:pointer;animation:glow 2.4s infinite}
.btn:active{background:var(--rose);color:#fff;border-color:var(--rose)}
@keyframes glow{50%{box-shadow:0 0 20px rgba(255,122,154,.7)}}
/* countdown */
#num{font-size:clamp(7rem,40vw,13rem);color:var(--rose);text-shadow:0 0 40px rgba(255,122,154,.7)}
#num.pop{animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(.3);opacity:0}40%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:.9}}
/* loading */
.pal{width:130px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px)}}
.bar{width:210px;height:6px;border-radius:9px;background:rgba(255,255,255,.15);margin-top:22px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));animation:load 2.6s forwards}
@keyframes load{to{width:100%}}
/* cake */
#cake{width:min(78vw,340px);margin-top:10px;overflow:visible}
#hl,#hr{transition:transform 1s cubic-bezier(.2,.8,.2,1);transform-origin:100px 150px}
#cake.cut #hl{transform:translateX(-16px) rotate(-5deg)}
#cake.cut #hr{transform:translateX(16px) rotate(5deg)}
#flame{transform-origin:100px 40px;animation:flick .25s infinite alternate}
@keyframes flick{to{transform:scale(1.12,.92) rotate(3deg)}}
#cake.cut #flame{display:none}
#knife{opacity:0;stroke-dasharray:130;stroke-dashoffset:130}
#cake.cut #knife{animation:slice .6s forwards}
@keyframes slice{30%{opacity:1}to{opacity:0;stroke-dashoffset:0}}
.hand{margin-top:8px;font-size:2rem;animation:swipe 1.8s infinite}
@keyframes swipe{0%{transform:translateX(-40px);opacity:0}30%,70%{opacity:1}100%{transform:translateX(40px);opacity:0}}
.link{margin-top:10px;background:none;border:0;color:var(--gold);opacity:.7;font:500 .95rem 'Quicksand';text-decoration:underline;cursor:pointer}
.c{position:absolute;top:-20px;width:9px;height:14px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) translateX(var(--dx)) rotate(720deg)}}
.stack{position:relative;width:min(68vw,270px);aspect-ratio:.85;margin:20px 0 10px}
.pc{position:absolute;inset:0;background:#fff;padding:10px 10px 36px;border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.45);transition:transform .55s ease,opacity .55s ease;cursor:pointer}
.pc .ph{width:100%;height:100%;position:relative;background:linear-gradient(135deg,#ffd6e0,#c9b6ff);display:flex;align-items:center;justify-content:center;font-size:3rem;overflow:hidden}
.pc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pc span{position:absolute;bottom:7px;left:0;right:0;color:#3a2350;font:700 1.3rem Caveat,cursive}
/* message */
#s7 h1{font-size:clamp(2.2rem,10vw,3.2rem);margin-bottom:14px}
.m{max-width:420px;max-height:56vh;overflow-y:auto;touch-action:pan-y;padding:4px 6px}
.m p{opacity:0;transform:translateY(14px);font-size:1.08rem;line-height:1.6;margin-bottom:14px}
#s7.active .m p{animation:up .9s forwards;animation-delay:calc(var(--i)*1.8s + .6s)}
.m .sig{font-family:'Caveat',cursive;font-weight:700;font-size:1.9rem;color:var(--rose)}
#again{opacity:0;margin-top:18px}
#s7.active #again{animation:up .9s forwards,glow 2.4s infinite}
#mus{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;z-index:20;display:none;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(247,217,168,.4);border-radius:999px;padding:4px 12px;font-size:.8rem;color:var(--gold);backdrop-filter:blur(6px)}
#mus button{background:none;border:0;color:inherit;font-size:1.1rem;cursor:pointer;padding:4px}
#mt{max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="mus"><button id="mplay">🎵</button><span id="mt"></span><button id="mnext">⏭</button></div>
<div id="fx"></div><div id="confetti"></div>

<!-- original character (reused) -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="pal" viewBox="0 0 120 120">
  <polygon points="60,6 40,44 80,44" fill="#f7d9a8"/><circle cx="60" cy="6" r="5" fill="#ff7a9a"/>
  <ellipse cx="60" cy="72" rx="44" ry="40" fill="#ffe3ea"/>
  <circle cx="44" cy="68" r="5" fill="#3a2350"/><circle cx="76" cy="68" r="5" fill="#3a2350"/>
  <ellipse cx="34" cy="80" rx="7" ry="4.5" fill="#ff9db4"/><ellipse cx="86" cy="80" rx="7" ry="4.5" fill="#ff9db4"/>
  <path d="M52 82q8 9 16 0" stroke="#3a2350" stroke-width="3" fill="none" stroke-linecap="round"/>
</symbol>
<symbol id="cakeart" viewBox="0 0 200 170">
  <ellipse cx="100" cy="148" rx="90" ry="10" fill="#ffffff" opacity=".18"/>
  <rect x="35" y="78" width="130" height="62" rx="12" fill="#e8a87c"/>
  <rect x="30" y="70" width="140" height="26" rx="13" fill="#fff1f4"/>
  <g fill="#fff1f4"><circle cx="46" cy="96" r="9"/><circle cx="78" cy="98" r="10"/><circle cx="114" cy="97" r="9"/><circle cx="148" cy="96" r="9"/></g>
  <text x="100" y="128" font-size="22" text-anchor="middle" fill="#ff7a9a">❤</text>
  <rect x="96" y="42" width="8" height="30" rx="2" fill="#f7d9a8"/>
</symbol>
<clipPath id="L"><rect x="-50" y="-20" width="150" height="240"/></clipPath>
<clipPath id="R"><rect x="100" y="-20" width="150" height="240"/></clipPath>
</defs></svg>

<!-- 1 Countdown -->
<section class="screen active" id="s1"><div id="num" class="script"></div></section>

<!-- 2 Loading -->
<section class="screen" id="s2">
  <svg class="pal"><use href="#pal"/></svg>
  <p class="script" style="font-size:2rem;margin-top:14px;color:var(--gold)">Getting your surprise ready…</p>
  <div class="bar"><i></i></div>
</section>

<!-- 3 Announcement -->
<section class="screen fade" id="s3">
  <h1 class="script">It's my <em id="name"></em> Birthday!</h1>
  <p class="sub">I made a little surprise, just for you ❤️</p>
  <button class="btn" data-go="s4">Start the surprise</button>
</section>

<!-- 4 Cake -->
<section class="screen" id="s4">
  <h1 class="script" style="font-size:clamp(2rem,9vw,3rem)">Swipe anywhere<br>to cut the cake!</h1>
  <svg id="cake" viewBox="0 0 200 170">
    <g id="hl" clip-path="url(#L)"><use href="#cakeart"/></g>
    <g id="hr" clip-path="url(#R)"><use href="#cakeart"/></g>
    <g id="flame"><ellipse cx="100" cy="32" rx="6" ry="10" fill="#ffb347"/><ellipse cx="100" cy="35" rx="3" ry="5" fill="#fff3b0"/></g>
    <line id="knife" x1="100" y1="20" x2="100" y2="150" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  </svg>
  <div class="hand" id="hand">👆</div>
  <button class="link" id="tapcut">or tap here to cut</button>
</section>

<!-- 5 Celebration -->
<section class="screen fade" id="s5">
  <svg class="pal"><use href="#pal"/></svg>
  <h1 class="script">Happy Birthday,<em id="name2"></em></h1>
  <button class="btn" data-go="s6">Next ❤️</button>
</section>

<!-- 6 placeholder for next steps -->
<section class="screen" id="s6">
  <h1 class="script" style="font-size:clamp(2.2rem,10vw,3.4rem)">Moments I Treasure</h1>
  <div class="stack" id="stack"></div>
  <p class="sub" id="pcount"></p>
  <p class="sub" style="font-size:.95rem;opacity:.65">tap the photo to see the next one</p>
  <button class="btn" data-go="s7">Next ❤️</button>
</section>
<section class="screen" id="s7"><h1 class="script">A little note for you</h1><div class="m" id="msg"></div><button class="btn" id="again">Watch again ❤️</button></section>

<script>
/* ===== EDIT HERE ===== */
const CONFIG = { name: "Shubham" };
// Your message: one line per paragraph. Replace with your own words!
const MESSAGE = [
  "Happy Birthday, my love.",
  "Thank you for every smile, every quiet moment, and every time you made a hard day feel lighter.",
  "I'm so grateful that I get to celebrate you today, and every day.",
  "I love you more than words can say.",
  "SIGN:Forever yours ❤️"
];
/* ===================== */
const $=id=>document.getElementById(id);
$('name').textContent=CONFIG.name+"'s";
$('name2').textContent=CONFIG.name+" ❤️";
document.title="Happy Birthday, "+CONFIG.name+" ❤️";

let cur='s1';
function go(id){$(cur).classList.remove('active');cur=id;$(id).classList.add('active');if(id==='s7')setTimeout(()=>confetti(50),MESSAGE.length*1800)}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));

$('msg').innerHTML=MESSAGE.map((t,i)=>t.startsWith('SIGN:')?`<p class="sig" style="--i:${i}">${t.slice(5)}</p>`:`<p style="--i:${i}">${t}</p>`).join('');
$('again').style.animationDelay=(MESSAGE.length*1.8+.8)+'s,0s';$('again').onclick=()=>location.reload();
// Countdown 3-2-1 -> loading -> announcement
(function(){const n=$('num');let c=3;
  function step(){n.textContent=c;n.classList.remove('pop');void n.offsetWidth;n.classList.add('pop');
    if(c--<=1)setTimeout(()=>{go('s2');setTimeout(()=>go('s3'),2900)},1000);else setTimeout(step,1000)}
  setTimeout(step,300)})();

// Confetti
function confetti(n){const box=$('confetti'),cols=['#ff7a9a','#f7d9a8','#ffffff','#a78bfa','#7dd3fc'];
  for(let i=0;i<n;i++){const e=document.createElement('div');e.className='c';
    e.style.cssText=`left:${Math.random()*100}%;background:${cols[i%5]};animation-duration:${2.5+Math.random()*2.5}s;animation-delay:${Math.random()*.6}s;--dx:${(Math.random()-.5)*160}px;border-radius:${i%3?'2px':'50%'}`;
    box.appendChild(e);setTimeout(()=>e.remove(),6000)}}

// Swipe to cut cake
let cut=false;
function doCut(){if(cut)return;cut=true;$('cake').classList.add('cut');$('hand').style.display='none';
  setTimeout(()=>confetti(90),500);setTimeout(()=>go('s5'),2400);setTimeout(()=>confetti(60),2600)}
let sx=0,sy=0;
$('s4').addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
$('s4').addEventListener('pointerup',e=>{if(Math.hypot(e.clientX-sx,e.clientY-sy)>50)doCut()});
$('tapcut').onclick=e=>{e.stopPropagation();doCut()};

const stack=$('stack');let idx=0;
stack.innerHTML=PHOTOS.map(p=>`<div class="pc"><div class="ph">💕<img src="${p.src}" alt="" style="object-position:${p.pos}" onerror="this.remove()"></div><span>${p.caption}</span></div>`).join('');
const cards=[...stack.children];
function layout(){cards.forEach((c,i)=>{const pos=(i-idx+cards.length)%cards.length;
  c.style.zIndex=cards.length-pos;
  c.style.transform=pos===0?'none':`translate(${pos%2?9:-9}px,${pos*6}px) rotate(${pos%2?4:-4}deg) scale(${1-pos*.03})`;
  c.style.opacity=pos>3?0:1});
  $('pcount').textContent=(idx+1)+" / "+cards.length}
layout();
stack.onclick=()=>{const c=cards[idx];c.style.transform='translateX(130%) rotate(18deg)';c.style.opacity=0;
  setTimeout(()=>{idx=(idx+1)%cards.length;layout()},450)};


// Background music: put your mp3 files in a "music" folder (song1.mp3, song2.mp3, ...)
const SONGS=[
  {title:"Tum Hi Ho",src:"music/song1.mp3"},
  {title:"Raabta",src:"music/song2.mp3"},
  {title:"Tera Ban Jaunga",src:"music/song3.mp3"}
];
(function(){const a=new Audio();let i=0,started=false,fails=0;
  function load(){a.src=SONGS[i].src;$('mt').textContent=SONGS[i].title}
  function next(){i=(i+1)%SONGS.length;load();if(started)a.play().catch(()=>{})}
  a.addEventListener('canplay',()=>{$('mus').style.display='flex';fails=0});
  a.addEventListener('error',()=>{if(++fails<SONGS.length)next()});
  a.addEventListener('ended',next);
  $('mplay').onclick=()=>{if(a.paused){started=true;a.play().catch(()=>{});$('mplay').textContent='🎵'}else{a.pause();$('mplay').textContent='🔇'}};
  $('mnext').onclick=next;
  load();
  document.addEventListener('pointerdown',()=>{if(!started){started=true;a.play().catch(()=>{})}},{once:true});
})();

// Floating hearts
setInterval(()=>{if(document.hidden)return;const e=document.createElement('div');e.className='p';
  e.textContent=['❤','✨','💫','🎈'][Math.floor(Math.random()*4)];
  e.style.cssText=`left:${Math.random()*100}%;font-size:${12+Math.random()*16}px;animation-duration:${7+Math.random()*5}s;--dx:${(Math.random()-.5)*100}px`;
  $('fx').appendChild(e);setTimeout(()=>e.remove(),12000)},600);
</script>
</body>
</html>
